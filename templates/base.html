<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}TareasCECyTEM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header class="barra">
    <a class="marca" href="{{ url_for('index') }}">Tareas<span>CECyTEM</span></a>
    <nav>
      <a href="{{ url_for('index') }}">Tareas</a>
      <a href="{{ url_for('registros') }}">Registros</a>
      <a href="{{ url_for('salud') }}">Conexión</a>
    </nav>
  </header>

  <main class="contenedor">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for tipo, texto in mensajes %}
        <div class="aviso aviso-{{ tipo }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">Práctica de despliegue · XAMPP → Aiven → GitHub → Render</footer>
</body>
</html>
